<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>3D Animator</title>

    <meta
        name="description"
        content="A browser-based 3D animation editor supporting GLB and FBX."
    />

    <meta
        name="theme-color"
        content="#1b1b1b"
    />

    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Prevent browser translation -->
    <meta name="google" content="notranslate">

    <!-- Open Graph -->
    <meta property="og:title" content="3D Animator">
    <meta property="og:description" content="Browser-based GLB and FBX animation editor.">
    <meta property="og:type" content="website">

    <style>
        html,
        body,
        #root {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;

            background: #1b1b1b;
            color: white;

            font-family:
                Inter,
                Segoe UI,
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        canvas {
            display: block;
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #202020;
        }

        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 8px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #666;
        }

        #loading {
            position: fixed;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #1b1b1b;

            z-index: 9999;

            transition: opacity .35s ease;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 60px;
            height: 60px;

            border-radius: 50%;

            border: 5px solid #333;
            border-top-color: #4ea4ff;

            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

    </style>
</head>

<body>

    <noscript>
        You need JavaScript enabled to run 3D Animator.
    </noscript>

    <div id="loading">
        <div class="spinner"></div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>

    <script>
        window.addEventListener("load", () => {
            const loading = document.getElementById("loading");

            if (loading) {
                loading.classList.add("hidden");

                setTimeout(() => {
                    loading.remove();
                }, 350);
            }
        });
    </script>

</body>
</html>
